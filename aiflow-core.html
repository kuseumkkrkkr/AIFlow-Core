<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIFlow-Core v0.5</title><style>:root{color-scheme:dark;--bg:#09111f;--p:#111d31;--l:#2b4164;--t:#edf4ff;--m:#9db0ca;--a:#74e0c0;--b:#83a8ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#173557,transparent 38%),var(--bg);color:var(--t);font:16px/1.6 system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:58px 22px}.eyebrow{color:var(--a);font-weight:700;letter-spacing:.12em;font-size:12px}h1{font-size:clamp(38px,6vw,64px);line-height:1.05;margin:12px 0}h1 span{color:var(--b)}.lead{color:var(--m);max-width:720px;font-size:18px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin-top:34px}@media(max-width:760px){.grid{grid-template-columns:1fr}}.card{background:#111d31e6;border:1px solid var(--l);border-radius:20px;padding:22px}label{display:block;color:var(--m);font-size:13px;margin-bottom:8px}textarea{width:100%;min-height:150px;background:#0b1628;color:var(--t);border:1px solid var(--l);border-radius:12px;padding:14px;font:inherit}button{border:0;border-radius:11px;padding:11px 18px;background:var(--a);font-weight:800;cursor:pointer;margin-top:12px}.secondary{background:#20375b;color:var(--t);margin-left:8px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.chip{border:1px solid var(--l);border-radius:999px;padding:5px 10px;color:var(--m);cursor:pointer;font-size:13px}.result{min-height:245px;white-space:pre-wrap;color:#dbe7ff}.status{border-radius:999px;padding:3px 9px;background:#174b42;color:var(--a);font-size:12px;font-weight:700}.rule{color:var(--b);font:13px monospace}.foot{color:var(--m);font-size:13px;margin-top:26px}</style></head><body><main><div class="eyebrow">DETERMINISTIC MATH REASONING</div><h1>AIFlow-Core <span>v0.5</span></h1><p class="lead">문제를 분류하고 지식 규칙으로 풀이를 생성한 뒤 독립 검산하는 수학 도메인 코어입니다.</p><section class="grid"><div class="card"><label for="q">문제 입력</label><textarea id="q">2x + 7 = 19일 때 x의 값은?</textarea><div class="chips"><span class="chip" data-q="2x + 7 = 19일 때 x의 값은?">일차방정식</span><span class="chip" data-q="첫째항이 5이고 공차가 3인 등차수열의 4번째 항은?">등차수열</span><span class="chip" data-q="|A|=18, |B|=12, |A∩B|=5일 때 |A∪B|는?">집합</span><span class="chip" data-q="6C2의 값은?">조합</span></div><button id="solve">풀이 생성</button><button class="secondary" id="clear">초기화</button></div><div class="card"><span class="status" id="status">READY</span> <span class="rule" id="rule">규칙 대기 중</span><div class="result" id="result">문제를 입력하면 단계별 풀이가 표시됩니다.</div></div></section><p class="foot">공개 데모는 브라우저 샘플입니다. 전체 엔진은 <code>engine/rule_based_nlp.py</code>에 있습니다.</p></main><script>
const q=document.querySelector('#q'),o=document.querySelector('#result'),s=document.querySelector('#status'),r=document.querySelector('#rule'),N=x=>Number(x.replace(/,/g,''));function solve(t){t=t.replace(/\s/g,'');let m;if(m=t.match(/([+-]?\d*)x([+-]\d+)=([+-]?\d+)/i)){let a=m[1]===''||m[1]=='+'?1:m[1]=='-'?-1:N(m[1]),b=N(m[2]),c=N(m[3]),x=(c-b)/a;return ['일차방정식','1) '+a+'x = '+(c-b),'2) x = '+x,'3) 재대입 확인 ✓'].join('\n')}if(m=t.match(/첫째항이([+-]?\d+).*공차가([+-]?\d+).*([0-9]+)번째/)){let a=N(m[1]),d=N(m[2]),k=N(m[3]),x=a+(k-1)*d;return ['등차수열','1) aₙ=a₁+(n−1)d','2) '+a+'+('+(k-1)+')×'+d,'3) = '+x+' ✓'].join('\n')}if(m=t.match(/\|A\|=([0-9]+).*\|B\|=([0-9]+).*\|A∩B\|=([0-9]+)/)){let x=N(m[1])+N(m[2])-N(m[3]);return ['집합','1) |A∪B|=|A|+|B|−|A∩B|','2) '+m[1]+'+'+m[2]+'−'+m[3],'3) = '+x+' ✓'].join('\n')}if(m=t.match(/([0-9]+)C([0-9]+)/i)){let a=N(m[1]),b=N(m[2]),x=1;for(let i=1;i<=b;i++)x=x*(a-b+i)/i;return ['조합','1) nCr=n!/(r!(n−r)!)','2) '+a+'C'+b,'3) = '+x+' ✓'].join('\n')}return null}function run(){let x=solve(q.value);if(!x){s.textContent='UNSUPPORTED';r.textContent='지원 규칙 없음';o.textContent='데모는 일차방정식·등차수열·집합·조합을 지원합니다.';return}s.textContent='PASS';r.textContent='분류 → 규칙 → 재검산';o.textContent=x}document.querySelector('#solve').onclick=run;document.querySelector('#clear').onclick=()=>{q.value='';run()};document.querySelectorAll('.chip').forEach(x=>x.onclick=()=>{q.value=x.dataset.q;run()});run();</script></body></html>
