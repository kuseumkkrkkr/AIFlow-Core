<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIFlow-Core v0.5</title><style>body{margin:0;background:#09111f;color:#edf4ff;font:15px system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:42px 20px}h1{font-size:clamp(36px,6vw,62px);margin:8px 0}h1 span{color:#74e0c0}.lead,.muted{color:#9db0ca}.tabs{display:flex;gap:8px;margin:26px 0}.tab{background:#20375b;color:#fff;border:0;border-radius:9px;padding:10px 15px;cursor:pointer}.tab.active{background:#74e0c0;color:#06151a;font-weight:700}.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:760px){.grid{grid-template-columns:1fr}}.card{background:#111d31;border:1px solid #2b4164;border-radius:18px;padding:20px}label{display:block;color:#9db0ca;margin:9px 0 5px;font-size:13px}textarea,select,input{width:100%;background:#0b1628;color:#fff;border:1px solid #2b4164;border-radius:9px;padding:10px;box-sizing:border-box;font:inherit}textarea{min-height:145px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}button.primary{padding:11px 16px;margin-top:12px;border:0;border-radius:9px;background:#74e0c0;font-weight:700;cursor:pointer}.chip{display:inline-block;border:1px solid #2b4164;border-radius:20px;padding:5px 9px;margin:8px 5px 0 0;color:#9db0ca;cursor:pointer;font-size:13px}.status{color:#74e0c0;font-weight:700}.result{white-space:pre-wrap;min-height:250px;margin-top:15px;color:#dbe7ff}.rule{color:#83a8ff;font:13px monospace}.stats{font-size:20px;color:#74e0c0;margin:12px 0}.cases{max-height:420px;overflow:auto}.case{border-top:1px solid #2b4164;padding:10px 0}.case b{color:#83a8ff}.foot{color:#7288a6;font-size:12px;margin-top:28px}</style></head><body><main><div style="color:#74e0c0;letter-spacing:.12em;font-size:12px">DETERMINISTIC MATH REASONING</div><h1>AIFlow-Core <span>v0.5</span></h1><p class="lead">문제를 직접 풀거나, 학년·반복 조건으로 문제를 생성해 정답·풀이·검산까지 확인하세요.</p><div class="tabs"><button class="tab active" data-tab="solvePanel">문제 풀기</button><button class="tab" data-tab="generatePanel">문제 생성 루프</button></div><section id="solvePanel" class="panel active"><div class="grid"><div class="card"><label for="q">문제 입력</label><textarea id="q">합성함수 f(x)=2x+1, g(x)=3x+2에서 f(g(4))</textarea><div><span class="chip" data-q="이차방정식 1x²-13x+36=0의 정수근">이차방정식</span><span class="chip" data-q="지수 2^8">지수</span><span class="chip" data-q="미분 f(x)=x^4, x=2">미분</span><span class="chip" data-q="정적분 0부터 3 x^2">적분</span></div><button class="primary" id="solve">전체 엔진으로 풀이</button></div><div class="card"><div><span class="status" id="status">READY</span> <span class="rule" id="rule">엔진 대기 중</span></div><div class="result" id="result">문제를 입력하면 풀이 단계와 독립 검산이 표시됩니다.</div></div></div></section><section id="generatePanel" class="panel"><div class="grid"><div class="card"><div class="row"><div><label>최소 학년</label><select id="min"><option>중3</option><option>고1</option><option selected>수1</option><option>수2</option><option>고2</option></select></div><div><label>최대 학년</label><select id="max"><option>중3</option><option>고1</option><option>수1</option><option selected>수2</option><option>고2</option></select></div></div><div class="row"><div><label>반복 횟수</label><input id="repeats" type="number" min="1" max="20" value="2"></div><div><label>seed</label><input id="seed" type="number" value="101"></div></div><label><input id="mock" type="checkbox" checked style="width:auto"> 모의고사 스타일 포함</label><button class="primary" id="generate">생성·검증 실행</button><p class="muted">생성된 모든 문항은 기대 정답, 실제 정답, 풀이 trace, 독립 검산을 함께 확인합니다.</p></div><div class="card"><span class="status" id="genStatus">READY</span><div class="stats" id="stats">아직 실행하지 않았습니다.</div><div class="cases" id="cases"></div></div></div></section><p class="foot">전체 엔진은 Vercel의 Python API와 저장소의 engine/rule_based_nlp.py를 사용합니다.</p></main><script>
const $=s=>document.querySelector(s);document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));t.classList.add('active');$('#'+t.dataset.tab).classList.add('active')});document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{$('#q').value=c.dataset.q;solve()});async function solve(){const q=$('#q').value.trim();if(!q)return;$('#status').textContent='RUNNING';$('#rule').textContent='전체 엔진 API';$('#result').textContent='풀이와 검산 중...';try{const x=await fetch('/api/solve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})}).then(r=>r.json());$('#status').textContent=x.status;$('#rule').textContent=(x.path&&x.path.rule_id)||((x.parse&&x.parse.domain)||'미지원');$('#result').textContent=x.status==='PASS'?['정답: '+x.result.answer,'공식: '+(x.result.formula||''),'',...(x.steps||[]),'','독립 검산: '+(x.result.verified?'통과':'실패')].join('\n'):(x.summary||x.reason||'해석 실패')}catch(e){$('#status').textContent='ERROR';$('#result').textContent=e.message}}$('#solve').onclick=solve;async function generate(){const payload={min_grade:$('#min').value,max_grade:$('#max').value,repeats:Number($('#repeats').value),seed:Number($('#seed').value),include_mock:$('#mock').checked};$('#genStatus').textContent='RUNNING';$('#stats').textContent='생성·풀이·검산 중...';$('#cases').textContent='';try{const x=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).then(r=>r.json());$('#genStatus').textContent=x.status;$('#stats').textContent=x.summary?`통과 ${x.summary.passed}/${x.summary.total} · 통과율 ${(x.summary.pass_rate*100).toFixed(1)}%`:x.reason;$('#cases').innerHTML=(x.cases||[]).map(c=>`<div class="case"><b>${c.curriculum} · ${c.status}</b><br>${c.question}<br><span class="muted">정답 ${c.answer} · 기대 ${c.expected} · ${c.trace_steps}단계 · ${c.verified?'검산 통과':'검산 실패'}</span></div>`).join('')}catch(e){$('#genStatus').textContent='ERROR';$('#stats').textContent=e.message}}$('#generate').onclick=generate;solve();</script></body></html>
