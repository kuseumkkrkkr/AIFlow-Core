<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AIFlow-Core v0.5</title><style>body{margin:0;background:#09111f;color:#edf4ff;font:16px system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:56px 20px}h1{font-size:clamp(38px,6vw,64px)}h1 span{color:#74e0c0}.lead{color:#9db0ca;font-size:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:30px}@media(max-width:700px){.grid{grid-template-columns:1fr}}.card{background:#111d31;border:1px solid #2b4164;border-radius:18px;padding:20px}textarea{width:100%;min-height:170px;background:#0b1628;color:#fff;border:1px solid #2b4164;border-radius:10px;padding:12px;font:inherit;box-sizing:border-box}button{padding:11px 17px;margin:12px 6px 0 0;border:0;border-radius:9px;background:#74e0c0;font-weight:700;cursor:pointer}.chip{display:inline-block;border:1px solid #2b4164;border-radius:20px;padding:5px 9px;margin:8px 5px 0 0;color:#9db0ca;cursor:pointer;font-size:13px}.status{color:#74e0c0;font-weight:700}.result{white-space:pre-wrap;min-height:280px;margin-top:18px;color:#dbe7ff}.rule{color:#83a8ff;font-family:monospace;font-size:13px}</style></head><body><main><div style="color:#74e0c0;letter-spacing:.12em;font-size:12px">DETERMINISTIC MATH REASONING</div><h1>AIFlow-Core <span>v0.5</span></h1><p class="lead">입력한 문제를 전체 지식 베이스와 규칙 엔진으로 분류·풀이·검산합니다.</p><section class="grid"><div class="card"><label for="q">문제 입력</label><textarea id="q">합성함수 f(x)=2x+1, g(x)=3x+2에서 f(g(4))</textarea><div><span class="chip" data-q="x²-11x+30=0의 정수근">이차방정식</span><span class="chip" data-q="합성함수 f(x)=2x+1, g(x)=3x+2에서 f(g(4))">합성함수</span><span class="chip" data-q="첫째항 9, 공차 -3인 등차수열의 17번째 항">등차수열</span><span class="chip" data-q="P(A∩B)=1/10, P(B)=1/2일 때 P(A|B)">조건부확률</span></div><button id="solve">전체 엔진으로 풀이</button><button id="clear">초기화</button></div><div class="card"><div><span class="status" id="status">READY</span> <span class="rule" id="rule">엔진 대기 중</span></div><div class="result" id="result">문제를 입력하면 전체 Python 규칙 엔진의 풀이 단계가 표시됩니다.</div></div></section></main><script>
const q=document.querySelector('#q'),o=document.querySelector('#result'),s=document.querySelector('#status'),r=document.querySelector('#rule');async function run(){if(!q.value.trim())return;s.textContent='RUNNING';r.textContent='전체 엔진 API';o.textContent='분류 → 슬롯 추출 → 최적 규칙 → 풀이 → 독립 검산 중...';try{const x=await fetch('/api/solve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q.value})}).then(v=>v.json());if(x.status!=='PASS'){s.textContent='FAIL';r.textContent=(x.parse&&x.parse.domain)||'미지원';o.textContent=x.reason||(x.result&&x.result.reason)||'해석 실패';return}s.textContent='PASS';r.textContent=(x.path&&x.path.rule_id)||'규칙 적용';o.textContent=['도메인: '+x.parse.domain,'정답: '+x.result.answer,'','풀이:',...(x.steps||[]),'','독립 검산: '+(x.result.verified?'통과':'실패')].join('\n')}catch(e){s.textContent='ERROR';r.textContent='API 연결 실패';o.textContent=e.message}}document.querySelector('#solve').onclick=run;document.querySelector('#clear').onclick=()=>{q.value='';s.textContent='READY';r.textContent='엔진 대기 중';o.textContent='문제를 입력하세요.'};document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{q.value=c.dataset.q;run()});run();</script></body></html>
